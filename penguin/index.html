<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>penguins</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #111;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #stage {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
    cursor: grab;
    touch-action: none;
  }
  #stage.dragging { cursor: grabbing; }
  #img {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    image-rendering: pixelated;
    user-select: none;
    -webkit-user-drag: none;
  }
  #hud {
    position: fixed;
    top: 14px;
    left: 14px;
    color: #eee;
    background: rgba(0,0,0,0.55);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
    pointer-events: none;
    backdrop-filter: blur(4px);
  }
  #hud b { color: #ffb84d; }
  #controls {
    position: fixed;
    bottom: 16px;
    right: 16px;
    display: flex;
    gap: 8px;
  }
  #controls button {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
  }
  #controls button:hover { background: rgba(255,255,255,0.22); }
</style>
</head>
<body>

<div id="stage">
  <img id="img" src="mygosh_compressed_v2.png" draggable="false" alt="penguins">
</div>

<div id="hud">
  🐧 <b>~700,000</b> penguins live here<br>
  scroll / pinch to zoom · drag to pan
</div>

<div id="controls">
  <button id="zoomOut">−</button>
  <button id="zoomIn">+</button>
  <button id="reset">⟲</button>
</div>

<script>
const stage = document.getElementById('stage');
const img = document.getElementById('img');

let scale = 1, minScale = 0.05, maxScale = 60;
let originX = 0, originY = 0;
let dragging = false, lastX = 0, lastY = 0;

function fitToScreen() {
  img.onload = () => {
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const sw = stage.clientWidth, sh = stage.clientHeight;
    scale = Math.min(sw / iw, sh / ih);
    minScale = scale * 0.5;
    originX = (sw - iw * scale) / 2;
    originY = (sh - ih * scale) / 2;
    update();
  };
  if (img.complete && img.naturalWidth) img.onload();
}

function update() {
  img.style.transform = `translate(${originX}px, ${originY}px) scale(${scale})`;
}

function zoomAt(clientX, clientY, factor) {
  const rect = stage.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  const newScale = Math.min(maxScale, Math.max(minScale, scale * factor));
  const ratio = newScale / scale;
  originX = x - (x - originX) * ratio;
  originY = y - (y - originY) * ratio;
  scale = newScale;
  update();
}

stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  zoomAt(e.clientX, e.clientY, factor);
}, { passive: false });

stage.addEventListener('mousedown', (e) => {
  dragging = true;
  stage.classList.add('dragging');
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', () => { dragging = false; stage.classList.remove('dragging'); });
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  originX += e.clientX - lastX;
  originY += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  update();
});

// touch support (drag + pinch)
let touchStartDist = null, touchStartScale = 1;
stage.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    dragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    dragging = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchStartDist = Math.hypot(dx, dy);
    touchStartScale = scale;
  }
}, { passive: true });

stage.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1 && dragging) {
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    originX += x - lastX;
    originY += y - lastY;
    lastX = x; lastY = y;
    update();
  } else if (e.touches.length === 2 && touchStartDist) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const factor = (dist / touchStartDist) * touchStartScale / scale;
    zoomAt(midX, midY, factor);
  }
}, { passive: true });

stage.addEventListener('touchend', (e) => {
  if (e.touches.length === 0) { dragging = false; touchStartDist = null; }
});

document.getElementById('zoomIn').onclick = () => zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1.4);
document.getElementById('zoomOut').onclick = () => zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1/1.4);
document.getElementById('reset').onclick = fitToScreen;

window.addEventListener('resize', fitToScreen);
fitToScreen();
</script>

</body>
</html>
